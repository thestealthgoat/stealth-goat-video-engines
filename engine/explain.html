<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script src="spring.js"></script>

<script>
// Explainer renderer (E2): draws a storyboard.json frame by frame on one continuous canvas that transforms in place.
// A beat lists the elements on screen. An element whose id is in the next beat stays and its numbers spring to the new
// values (a state change); an element that is not exits (smooth fade + drift up), a new one enters (snappy slide +
// smooth fade, never growing from zero). Captions (the beat's `say`) run word by word in one fixed zone, the keyword
// in an accent box (E1 style). All motion is spring.js and every frame is a pure function of t. Colours and fonts come
// from setup(cfg): cfg.colors (bg, panel, text, dim, accent, signal, hot, cool), cfg.fonts (Head, Body, BodySB, Mono).
// Coordinates are frame fractions (x, y, w, h); an element may carry "v": {...} overrides used in a portrait frame.
const S = window.Spring, PR = S.PRESETS;

const SETTLE1 = {};

const col = (c) => (c && c[0] !== '#' ? (C[c] || c) : c);

async function loadFonts(fonts) {

    try { await ff.load(); document.fonts.add(ff); } catch (e) { failed.push(n); }

// ---- timeline: element lives and keyframes ------------------------------------------------------------------------

      const at = b.t0 + (e.in || 0) + (!cont && bi > 0 && !e.in ? ENTER_GAP : 0);
      if (cont && e.in) {                               // a delayed re-declaration: a string that changes (text, label,
        const last = open[e.id].keys[open[e.id].keys.length - 1].p, blank = {};   // unit) leaves at the cut, so an old value
        for (const k of STRKEYS) if (k in last && last[k] !== p[k]) blank[k] = ''; // never sits next to the new beat's words

      }
      if (cont) open[e.id].keys.push({ t: b.t0 + (e.in || 0), p, full: true });   // a full re-declaration: no style carry-over

// a string that changed at a keyframe crossfades: old slides up and out, new rises in (smooth, ~0.3 s)
const SWAP = 0.3;

// ---- drawing helpers ------------------------------------------------------------------------------------------------

// ---- element types ------------------------------------------------------------------------------------------------

    });
    ctx.restore();
    ctx.save(); ctx.strokeStyle = hexA(col('dim'), 0.6); ctx.lineWidth = 2; rrect(cx - w / 2, cy - h / 2, w, h, 0.012 * base); ctx.stroke(); ctx.restore();
    if (p.credit) text(p.credit, cx + w / 2, cy + h / 2 + 0.028 * base, { size: 0.02 * base, font: 'Mono', color: 'dim', align: 'right' });
  },
};

// ---- frame ----------------------------------------------------------------------------------------------------------
function captions(t) {
  const b = B.beats.find((x) => t >= x.t0 && t < x.t1); if (!b || !b.say) return;
  const words = b.words || [], base = Math.min(W, H), size = (PORTRAIT ? 0.058 : 0.046) * base;
  const zoneY = (PORTRAIT ? 0.80 : 0.875) * H, maxW = (PORTRAIT ? 0.86 : 0.78) * W;
  ctx.save(); ctx.font = `${size}px BodySB`;
  const sp = ctx.measureText(' ').width, lines = [[]]; let lw = 0;
  const kp = size * 0.24;                          // a key word gets its own room for the box on both sides
  words.forEach((wd) => { const ww = ctx.measureText(wd.w).width, pad = wd.key ? kp : 0; if (lw + ww + 2 * pad > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push({ ...wd, ww, pad }); lw += ww + 2 * pad + sp; });
  const lh = size * 1.3, top = zoneY - (lines.length - 1) * lh / 2;
  const lastS = words.length ? words[words.length - 1].s : b.t0;
  const exit = 1 - fade(t, Math.max(b.t1 - 0.12, lastS + 0.3), 'ui');   // the last word is always readable
  lines.forEach((ln, li) => {
    const tw = ln.reduce((s, x) => s + x.ww + 2 * x.pad, 0) + sp * (ln.length - 1); let x = W / 2 - tw / 2;
    ln.forEach((wd) => {
      x += wd.pad;
      const a = fade(t, wd.s - 0.06, 'smooth') * exit, dy = (1 - prog(t, wd.s - 0.06, 'snappy')) * size * 0.35, y = top + li * lh + dy;
      if (a > 0.003) {
        if (wd.key) {
          const k = fade(t, wd.s, 'snappy'); ctx.save(); ctx.globalAlpha = a * k; ctx.strokeStyle = col('key'); ctx.lineWidth = 4; ctx.fillStyle = hexA(col('key'), 0.16);
          rrect(x - size * 0.18, y - size * 0.66, wd.ww + size * 0.36, size * 1.25, size * 0.2); ctx.fill(); ctx.stroke(); ctx.restore();
        }
        ctx.globalAlpha = a; ctx.fillStyle = wd.key ? col('key') : C.text; ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = size * 0.15; ctx.fillText(wd.w, x, y);
      }
      x += wd.ww + wd.pad + sp;
    });
  });
  ctx.restore();
}

window.frameAt = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, Math.max(W, H) * 0.75);
  g.addColorStop(0, C.bg2); g.addColorStop(1, C.bg); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const [dx, dy] = S.handheld(t, 0.006 * Math.min(W, H), 0.22, 7);   // the stage drifts (>= ~0.3 px a frame): never frozen
  ctx.save(); ctx.translate(dx, dy);
  const live = LIVES.filter((L) => t >= L.enter && t < L.exit + 0.6).map((L) => [L, params(L, t)]);
  const byId = {}; live.forEach(([L, p]) => (byId[L.id] = p));
  for (const [L, p] of live) {
    if (p.fromKnob && byId[p.fromKnob.id]) {         // a readout tied to a knob: value = base x 10^(dB/20), same clock
      const kn = byId[p.fromKnob.id]; p.value = p.fromKnob.base * Math.pow(10, (kn.dB || 0) / 20);
      if (p.fromKnob.hotAbove != null) p.hot = p.value > p.fromKnob.hotAbove ? 'hot' : null;
    }
    const life = { enter: L.enter, age: t - L.enter, first: L.first, keys: L.keys };
    const ain = fade(t, L.enter), yin = (1 - prog(t, L.enter, 'snappy')) * 0.035 * H;
    const aout = t >= L.exit ? 1 - fade(t, L.exit, timed('smooth', EXIT_S)) : 1, yout = t >= L.exit ? -0.02 * H * fade(t, L.exit, timed('smooth', EXIT_S)) : 0;
    const a = ain * aout; if (a <= 0.002) continue;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, yin + yout); DRAW[L.type](p, t, life); ctx.restore();
  }
  ctx.restore();
  captions(t);
  grain(t);
  return ctx.canvas.toDataURL('image/png');
};
// soft film grain (deterministic: 4 noise tiles at half size, one per frame in a fixed order, laid on with 'overlay'):
// keeps gradients from banding and a held frame from being a pixel copy of the last one
let GRAIN = null;
function grain(t) {
  if (cfg.grain === 0) return;
  if (!GRAIN) {
    GRAIN = []; let seed = 7654321;
    const rnd = () => (seed = (Math.imul(seed, 1103515245) + 12345) >>> 0) / 4294967296;
    for (let k = 0; k < 4; k++) {
      const c = document.createElement('canvas'); c.width = W / 2; c.height = H / 2;
      const x = c.getContext('2d'), d = x.createImageData(c.width, c.height);
      for (let i = 0; i < d.data.length; i += 4) { const g = 128 + 9 * (rnd() + rnd() + rnd() - 1.5) * 2; d.data[i] = d.data[i + 1] = d.data[i + 2] = g; d.data[i + 3] = 255; }
      x.putImageData(d, 0, 0); GRAIN.push(c);
    }
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = cfg.grain || 0.5;
  ctx.imageSmoothingEnabled = false; ctx.drawImage(GRAIN[((Math.round(t * 29.97) % 4) + 4) % 4], 0, 0, W, H); ctx.restore();
}
window.ready = true;
</script></body></html>
