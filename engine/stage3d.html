  shadowFloor(-0.01);

    const tx = shotTex(im), ch = cw * tx.h / tx.w;

// ---- P3 badge clash (two badges fly in and collide: the piece's one slam) and toggle switches (UI springs).

  shadowFloor(0); const a = c.text1 ?? 'Before', b = c.text2 ?? 'After', HIT = 1.0, upd = [];
  const mk = (s, color, ink) => {
    const g = new THREE.Group(); const body = new THREE.Mesh(new RoundedBoxGeometry(4.6, 1.7, 0.55, 6, 0.27), glossy(color)); shadowy(body); g.add(body);
    const tx = canvasTex(1000, 360, (cx, w, h) => { fit(cx, caps(s), 'head', h * 0.56, w * 0.86); cx.fillStyle = ink; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(caps(s), w / 2, h * 0.53); }).set();

  };

SCENES.toggle = (c) => {

// ---- L6 3D extruded type flythrough: the word (glyph outlines from the profile's head font, or any SVG mark) stands
// on the floor in 3D; the camera starts low beside the first letter, flies along the word past the letters' faces and
// rises to land square on the lockup (the hit); a slow drift keeps the end alive. H7 light: warm key, cool rim, contact.
SCENES.extrude = (c) => {

  const size = bb.getSize(new THREE.Vector2()), k = 10 / size.x;               // the word is 10 units wide
  const depth = (c.depth ?? 0.22) * size.y, bev = 0.035 * size.y;
  const geo = new THREE.ExtrudeGeometry(shapes, { depth, bevelEnabled: true, bevelThickness: bev, bevelSize: bev * 0.8, bevelSegments: 4, curveSegments: 10 });
  // --text: the baseline (c.baseline, SVG y=0) stands on the floor and descenders dip below it, as type does;
  // --svg: the bottom of the mark stands on the floor
  const base = c.baseline ?? bb.max.y;
  geo.translate(-(bb.min.x + size.x / 2), -base, -depth / 2);                 // centred, standing on its baseline
  const face = glossy(col(c.faceColor ?? 'text'), { clearcoat: 0.6, roughness: 0.32 });

  } };
};

// ================================================================ setup + frames
const FX = { amt: 0, at: [0.5, 0.5], spin: 0, spread: 0.25, behind: false };
window.setup = async function (cfg) {

  cam = new THREE.PerspectiveCamera(cfg.fov ?? 32, W / H, 0.1, 400);

window.frameAt = function (t, layer = 'all') {

  R.setClearColor(0x000000, 0); R.clear();

  const fx = FX.amt > 0.002 && layer !== 'back';
  if (fx) { fxMat.uniforms.amt.value = FX.amt; fxMat.uniforms.spread.value = FX.spread; fxMat.uniforms.at.value.set(FX.at[0], FX.at[1]); fxMat.uniforms.spin.value = FX.spin; }
  if (fx && FX.behind) R.render(fxScene, bgCam);              // a glow behind the scene (brand glow)
  R.render(scene, cam);

  return R.domElement.toDataURL('image/png');
};
window.ready = true;
