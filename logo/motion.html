<script type="module">
// Logo motion graphics: 3D logo (engine.js) + 2D layer (text, light sweep, panels, sponsor art), rendered
// deterministically frame by frame with a transparent background. Templates: intro, outro, bug_in/bug_loop/bug_out,
// stinger, presented, slam, lockup and more. Brand fonts and colours arrive in the setup() config (cfg.fonts: family -> font URL,
// cfg.colors: primary / accent / text), so this page holds no brand values.
// All motion is spring.js (2026-11-08): no fixed-duration eases. Logo lands bouncy / slam, panels and text snappy,
// pushes and fades smooth (opacity clamped, never overshoots), drifts gentle. Where a template's beat is longer than the
// preset's own settle time, timed() keeps the preset's damping and slows its omega so the move settles on the old beat.
import * as THREE from 'three';
import { makeRenderer, makeScene, buildLogo } from './engine.js';

let W, H, R, scene, cam, logo, out, ctx, tmp, tctx, cfg, sponsorImg = null, plateImg = null, tpl, PRIMARY, ACCENT, TXT;
const Spring = window.Spring, P = Spring.PRESETS;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const SETTLE1 = {};
// preset `name` (its zeta) with omega scaled so the move settles (0.5%) in `secs`. launch = start speed in units of
// omega: 0 = starts at rest; 1 with a zeta-1 preset = starts at full speed and decelerates (a pure exponential approach).
function timed(name, secs, launch = 0) {
  const p = P[name], key = name + ':' + launch;
  if (SETTLE1[key] == null) SETTLE1[key] = Spring.settle({ zeta: p.zeta, omega: 1, v0: launch });
  const omega = SETTLE1[key] / secs;
  return { zeta: p.zeta, omega, v0: launch * omega };
}
const prog = (t, start, c) => Spring.progress(t, { start, ...c });                 // 0 -> 1 (overshoots if zeta < 1)
const move = (t, start, from, to, c) => Spring.at(t, { start, from, to, ...c });    // value from -> to
const fadeIn = (t, start, c) => Spring.clamp01(prog(t, start, c));                  // opacity: never overshoots
// Exits accelerate: an exponential spring run backwards from `end`, so the exit finishes at full speed exactly at `end`.
const exitP = (t, end, secs) => t >= end ? 1 : Spring.clamp01(1 - prog(end - t, 0, timed('smooth', secs, 1)));
// light sweep position: a smooth spring from 0 to just past 1 (glint() draws nothing outside 0..1)
const sweep = (t, start, secs) => 1.05 * prog(t, start, timed('smooth', secs));
// first time a spring reaches its target (to land a hit on an exact beat: start it this long before the beat)
function firstCross(c) { for (let t = 0; t < 2; t += 1e-4) if (prog(t, 0, c) >= 1) return t; return 0; }

// Every font in cfg.fonts is required: if one does not load, setup() throws (motion.py then exits non-zero)
// instead of the text silently falling back to the browser's default serif.
async function loadFonts(fonts) {
  const failed = [];
  for (const [n, u] of Object.entries(fonts || {})) {
    const ff = new FontFace(n, `url(${u})`);
    try { await ff.load(); document.fonts.add(ff); } catch (e) { failed.push(`${n} (${e && e.message || e})`); }
  }
  await document.fonts.ready;
  if (failed.length) throw new Error('font load failed: ' + failed.join(', '));
}

window.setup = async function (c) {
  cfg = c; W = c.width || 1920; H = c.height || 1080;
  const col = c.colors || {}; PRIMARY = col.primary; ACCENT = col.accent; TXT = col.text;
  await loadFonts(c.fonts);
  R = makeRenderer(W, H); scene = makeScene(R);
  cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 1000); cam.position.set(0, 0, 12); cam.lookAt(0, 0, 0);
  logo = buildLogo(c.svg, { depth: c.depth ?? 0.03 }); scene.add(logo);
  out = document.createElement('canvas'); out.width = W; out.height = H; document.body.appendChild(out); ctx = out.getContext('2d');
  tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; tctx = tmp.getContext('2d');
  if (c.sponsor) { sponsorImg = new Image(); sponsorImg.src = c.sponsor; await sponsorImg.decode(); }
  if (c.plate) { plateImg = new Image(); plateImg.src = c.plate; await plateImg.decode(); }
  tpl = TEMPLATES[c.template];
  if (!tpl) throw new Error(`unknown template ${c.template} (have: ${Object.keys(TEMPLATES).join(', ')})`);
  if (tpl.prep) await tpl.prep(c);
  return { duration: c.dur ?? tpl.dur, cut: tpl.cut ?? null, hit: tpl.hitAt ? tpl.hitAt() : null };
};

// visible world size on the z=0 plane
function vis() { const vh = 2 * cam.position.z * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)); return { w: vh * cam.aspect, h: vh }; }

// place the logo: cx, cy = centre in frame fractions (0..1, y down); box = max width/height as frame fractions
function placeLogo(s) {
  const v = vis(), sz = logo.userData.size;
  const k = Math.min((s.bw * v.w) / sz.w, (s.bh * v.h) / sz.h) * (s.scale ?? 1);
  logo.scale.setScalar(Math.max(k, 1e-4));
  logo.position.set((s.cx - 0.5) * v.w, (0.5 - s.cy) * v.h, s.z ?? 0);
  logo.rotation.set(s.rx ?? 0, s.ry ?? 0, s.rz ?? 0);
}

function drawText(t) {
  ctx.save(); ctx.globalAlpha = clamp(t.op ?? 1);
  ctx.font = `${t.size}px ${t.font}`; ctx.fillStyle = t.color; ctx.textAlign = t.align || 'center'; ctx.textBaseline = 'middle';
  if (t.spacing) ctx.letterSpacing = t.spacing + 'px';
  if (t.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = t.size * 0.12; ctx.shadowOffsetY = t.size * 0.04; }
  ctx.fillText(t.str, t.x * W, t.y * H); ctx.restore();
}

// light sweep across whatever is on the logo layer (p: 0..1 across the frame)
function glint(p, alpha = 0.55) {
  if (p <= 0 || p >= 1) return;
  tctx.save(); tctx.globalCompositeOperation = 'source-atop';
  const x = -0.3 * W + p * 1.6 * W, wdt = 0.12 * W;
  const g = tctx.createLinearGradient(x - wdt, 0, x + wdt, H * 0.25);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${alpha})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  tctx.fillStyle = g; tctx.fillRect(0, 0, W, H); tctx.restore();
}

window.frameAt = function (t) {
  ctx.clearRect(0, 0, W, H);
  const f = tpl.fn(t, cfg);
  (f.under || []).forEach((p) => p(ctx));
  if (f.logo && (f.logo.op ?? 1) > 0.001) {
    placeLogo(f.logo); R.render(scene, cam);
    tctx.clearRect(0, 0, W, H); tctx.drawImage(R.domElement, 0, 0);
    if (f.glint != null) glint(f.glint);
    ctx.save(); ctx.globalAlpha = clamp(f.logo.op ?? 1); ctx.drawImage(tmp, 0, 0); ctx.restore();
  }
  (f.over || []).forEach((p) => p(ctx));
  (f.texts || []).forEach(drawText);
  if (cfg.finish) return applyFinish(t);
  return out.toDataURL('image/png');
};

// ---- F1 cinematic finish (--finish dark): a post pass on any template ------------------------------------------------
// dark ground (radial), a reflective floor under the content (mirrored at its lowest point, blurred = shallow depth of
// field, faded out), bloom under the content (a blurred bright copy, so the logo itself stays sharp), film grain and a
// vignette; optional laptop mockup (the finished frame on a laptop screen with a glass reflection). Settings from the
// profile's finish.dark block (motion.py merges defaults). The result is opaque.
let FIN = null;
function finishCanvases() {
  if (FIN) return FIN;
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; };
  const [a, ax] = mk(), [b, bx] = mk(), [m, mx] = mk(), [s, sx] = mk(); s.width = 64; s.height = 36;
  const grains = []; let seed = 99991;
  const rnd = () => (seed = (Math.imul(seed, 1103515245) + 12345) >>> 0) / 4294967296;
  for (let k = 0; k < 4; k++) { const [g, gx] = mk(); g.width = W / 2; g.height = H / 2; const d = gx.createImageData(g.width, g.height);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + 10 * (rnd() + rnd() + rnd() - 1.5) * 2; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    gx.putImageData(d, 0, 0); grains.push(g); }
  FIN = { a, ax, b, bx, m, mx, s, sx: s.getContext('2d', { willReadFrequently: true }), grains };
  return FIN;
}
function contentBottom() {                                   // lowest row with content (fraction of H), from a 64x36 copy
  const F = finishCanvases(); F.sx.clearRect(0, 0, 64, 36); F.sx.drawImage(out, 0, 0, 64, 36);
  const d = F.sx.getImageData(0, 0, 64, 36).data;
  for (let y = 35; y >= 0; y--) for (let x = 0; x < 64; x++) if (d[(y * 64 + x) * 4 + 3] > 40) return (y + 1) / 36;
  return 0.7;
}
function applyFinish(t) {
  const F = finishCanvases(), o = cfg.finish, f = F.ax;
  f.setTransform(1, 0, 0, 1, 0, 0); f.globalAlpha = 1; f.globalCompositeOperation = 'source-over'; f.filter = 'none';
  const g = f.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, W * 0.8); g.addColorStop(0, o.bg2); g.addColorStop(1, o.bg);
  f.fillStyle = g; f.fillRect(0, 0, W, H);
  if (o.floor > 0) {                                         // reflective floor: mirrored, blurred, fading out
    const yf = Math.min(0.92, contentBottom() + 0.01) * H, bx = F.bx;
    bx.setTransform(1, 0, 0, 1, 0, 0); bx.clearRect(0, 0, W, H); bx.save(); bx.translate(0, 2 * yf); bx.scale(1, -1);
    bx.filter = `blur(${o.dof}px)`; bx.drawImage(out, 0, 0); bx.restore(); bx.filter = 'none';
    const mg = bx.createLinearGradient(0, yf, 0, yf + 0.28 * H); mg.addColorStop(0, 'rgba(0,0,0,1)'); mg.addColorStop(1, 'rgba(0,0,0,0)');
    bx.globalCompositeOperation = 'destination-in'; bx.fillStyle = mg; bx.fillRect(0, 0, W, H); bx.globalCompositeOperation = 'source-over';
    f.save(); f.globalAlpha = o.floor; f.drawImage(F.b, 0, 0); f.restore();
  }
  if (o.bloom > 0) { f.save(); f.globalCompositeOperation = 'lighter'; f.filter = `blur(${Math.round(0.018 * H)}px) brightness(1.3)`;
    f.globalAlpha = o.bloom; f.drawImage(out, 0, 0); f.restore(); f.filter = 'none'; }
  f.drawImage(out, 0, 0);                                    // the content itself stays sharp
  if (o.grain > 0) { f.save(); f.globalCompositeOperation = 'overlay'; f.globalAlpha = o.grain; f.imageSmoothingEnabled = false;
    f.drawImage(F.grains[((Math.round(t * 60) % 4) + 4) % 4], 0, 0, W, H); f.restore(); }
  if (o.vignette > 0) { const v = f.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${o.vignette})`); f.fillStyle = v; f.fillRect(0, 0, W, H); }
  if (o.mockup !== 'laptop') return F.a.toDataURL('image/png');
  const m = F.mx;                                            // laptop mockup: the frame on a screen, glass reflection
  m.setTransform(1, 0, 0, 1, 0, 0); m.fillStyle = o.bg; m.fillRect(0, 0, W, H);
  const sw = 0.62 * W, sh = sw * H / W, sx0 = (W - sw) / 2, sy0 = 0.12 * H, bz = 0.012 * W;
  const drift = 0.006 * H * Math.sin(t * 0.8);              // the laptop floats a little
  m.save(); m.translate(0, drift);
  m.fillStyle = '#1A1C20'; m.beginPath(); m.roundRect(sx0 - bz, sy0 - bz, sw + 2 * bz, sh + 2 * bz, bz); m.fill();
  m.drawImage(F.a, sx0, sy0, sw, sh);
  const gl = m.createLinearGradient(sx0, sy0, sx0 + sw * 0.6, sy0 + sh); gl.addColorStop(0, 'rgba(255,255,255,0.10)'); gl.addColorStop(0.5, 'rgba(255,255,255,0)');
  m.fillStyle = gl; m.fillRect(sx0, sy0, sw, sh);
  m.fillStyle = '#2A2D33'; m.beginPath(); m.moveTo(sx0 - 0.06 * W, sy0 + sh + bz); m.lineTo(sx0 + sw + 0.06 * W, sy0 + sh + bz);
  m.lineTo(sx0 + sw + 0.03 * W, sy0 + sh + bz + 0.03 * H); m.lineTo(sx0 - 0.03 * W, sy0 + sh + bz + 0.03 * H); m.closePath(); m.fill();
  m.restore();
  return F.m.toDataURL('image/png');
}

// slam: the hit spring starts this long before the landing beat, so it reaches the landing exactly on the beat
const SLAM_LAND = 0.42, SLAM_MID = 1.15, SLAM_LEAD = firstCross(P.slam);
const STINGER_CUT = 0.55;
const INTRO_LAND = 0.5, INTRO_LEAD = firstCross(P.bouncy), OUTRO_LAND = 0.45;

const TEMPLATES = {
  // logo slams in from behind the camera with a turn (never shows its back), lands with a bounce at 0.42 s, light sweep,
  // slow drift. Fly-in: a decelerating smooth spring from 2.8x; the last 15% of the scale is a slam-preset hit that crosses
  // the landing size on the 0.42 s beat and bounces. cfg.place = {cx, cy, bw, bh} (frame fractions) sets where it lands;
  // cfg.dur sets the length (holds after landing, drifting gently).
  slam: { dur: 2.0, fn: (t, c) => {
    const p = c.place || { cx: 0.5, cy: 0.45, bw: 0.6, bh: 0.45 }, L = SLAM_LAND;
    const fly = prog(t, 0, timed('smooth', 0.55, 1)), hit = prog(t, L - SLAM_LEAD, P.slam);
    const k = t > L ? t - L : 0, drift = prog(t, L, timed('gentle', 1.0));          // drift fades in after the hit
    return {
      logo: { cx: p.cx, cy: p.cy, bw: p.bw, bh: p.bh, scale: 2.8 + (SLAM_MID - 2.8) * fly + (1 - SLAM_MID) * hit,
              ry: (1 - fly) * -1.25 + drift * 0.10 * Math.sin(k * 1.3), rx: (1 - fly) * 0.3 + drift * 0.05 * (1 - Math.cos(k * 1.3)),
              rz: (1 - fly) * 0.22, op: fadeIn(t, 0, timed('smooth', 0.2)) },
      glint: sweep(t, 0.55, 0.7),
    };
  } },
  // 4 s: logo flies in from the camera with a turn and lands on a hit at 0.5 s (the hook: a big move in the first second),
  // then pushes in slowly to full size under the light sweep (1.5 s); text at 1.6 s; holds on the last frame
  intro: { dur: 4, fn: (t, c) => {
    const L = INTRO_LAND, fly = prog(t, 0, timed('smooth', 0.65, 1)), hit = prog(t, L - INTRO_LEAD, P.bouncy);
    const push = prog(t, L, timed('smooth', 1.75));                                 // settles as the end hold starts (2.25 s)
    return {
      logo: { cx: 0.5, cy: c.text1 ? 0.45 : 0.5, bw: 0.7, bh: 0.55, scale: 2.6 + (1.0 - 2.6) * fly + (0.9 - 1.0) * hit + 0.1 * push,
              ry: (1 - fly) * -1.1, rx: (1 - fly) * 0.25, rz: (1 - fly) * 0.15, op: fadeIn(t, 0, timed('smooth', 0.2)) },
      glint: sweep(t, 1.5, 0.9),
      texts: c.text1 ? [{ str: c.text1, font: 'Head', size: 72, color: TXT, x: 0.5, y: move(t, 1.6, 0.81, 0.78, timed('snappy', 0.6)),
                          op: fadeIn(t, 1.6, timed('smooth', 0.6)), spacing: 6 }] : [],
    };
  } },
  // 6 s end card: logo falls in from above and from close to the camera (2.2x) and lands with a bounce at 0.45 s (the
  // hook: a big move in the first half second), two text lines
  // (snappy), sweep, gentle sway, everything fades out by 6 s
  outro: { dur: 6, fn: (t, c) => {
    const fly = prog(t, 0, timed('smooth', 0.5)), hit = prog(t, OUTRO_LAND - INTRO_LEAD, P.bouncy);   // falls (fastest on screen), bounces in
    const drop = 0.05 + 0.27 * fly + 0.06 * hit, zoom = 2.2 - 1.2 * fly, a = fadeIn(t, 0, timed('smooth', 0.1)), fade = 1 - exitP(t, 6, 0.8);
    const l1 = timed('snappy', 0.6), l2 = timed('smooth', 0.6);
    return {
      logo: { cx: 0.5, cy: drop, bw: 0.58, bh: 0.42, scale: zoom, ry: Math.sin(t * 1.1) * 0.12 * a, rx: (Math.cos(t * 1.1) - 1) * 0.05 * a, op: a * fade },
      glint: sweep(t, 2.0, 0.9),
      texts: [
        c.text1 && { str: c.text1, font: 'Head', size: 84, color: TXT, x: 0.5, y: move(t, 0.9, 0.73, 0.70, l1), op: fadeIn(t, 0.9, l2) * fade, spacing: 8 },
        c.text2 && { str: c.text2, font: 'BodySB', size: 44, color: c.accent || ACCENT, x: 0.5, y: move(t, 1.2, 0.82, 0.79, l1), op: fadeIn(t, 1.2, l2) * fade, spacing: 2 },
      ].filter(Boolean),
    };
  } },
  // corner bug in three clips (bottom-right, inside the safe margin). The loop sways the logo on a slow ellipse (ry and rx
  // a quarter turn apart, so it never stops); bug_in ends and bug_out starts in the loop's start pose, so the cuts are seamless.
  bug_in: { dur: 1.0, fn: (t) => {
    const land = prog(t, 0, timed('bouncy', 0.8)), turn = prog(t, 0, timed('smooth', 0.8, 1));
    return { logo: bugPos(land, (1 - turn) * 1.2 + bugSway(t - 1.0).ry, bugSway(t - 1.0).rx, fadeIn(t, 0, timed('smooth', 0.25))), glint: sweep(t, 0.55, 0.45) };
  } },
  bug_loop: { dur: 6, fn: (t) => { const s = bugSway(t); return { logo: bugPos(1, s.ry, s.rx, 1), glint: loopSweep(t) }; } },
  bug_out: { dur: 0.8, fn: (t, c) => {
    const L = 0.8 - 1 / (c.fps || 60), a = exitP(t, L, 0.7 - 1 / (c.fps || 60)), s = bugSway(t); // shrink + fade end on the last frame
    return { logo: bugPos(1 - a, s.ry + a * 1.2, s.rx, 1 - exitP(t, L, 0.35)) };
  } },
  // 1.2 s transition: primary-colour panel + accent edge wipe across, logo hits centre; frame fully covered at the cut point
  // (0.55 s). The panel moves on smooth springs (no overshoot: an overshoot would uncover the frame edge around the cut).
  stinger: { dur: 1.2, cut: STINGER_CUT, fn: (t) => {
    const inP = prog(t, 0, timed('smooth', 0.5)), outP = exitP(t, 1.2, 0.52);
    const x0 = (1 - inP) * 1.15 * W - outP * 1.15 * W;              // panel left edge
    const panel = (cx) => { cx.save(); cx.fillStyle = PRIMARY; cx.beginPath(); cx.moveTo(x0, 0); cx.lineTo(x0 + 1.15 * W, 0);
      cx.lineTo(x0 + 1.15 * W - 0.15 * W, H); cx.lineTo(x0 - 0.15 * W, H); cx.closePath(); cx.fill();
      cx.fillStyle = ACCENT; const e = 0.025 * W;                         // accent leading and trailing edges
      [[x0 - e, x0], [x0 + 1.15 * W, x0 + 1.15 * W + e]].forEach(([a, b]) => { cx.beginPath(); cx.moveTo(a, 0); cx.lineTo(b, 0); cx.lineTo(b - 0.15 * W, H); cx.lineTo(a - 0.15 * W, H); cx.closePath(); cx.fill(); });
      cx.restore(); };
    const hit = move(t, 0.2, 0.4, 1, P.bouncy), turn = prog(t, 0.2, timed('smooth', 0.42, 1)), lo = exitP(t, 1.0, 0.3);
    return { under: [panel], logo: { cx: 0.5 + outP * -0.9, cy: 0.5, bw: 0.55, bh: 0.45, scale: hit + lo * 0.25,
             ry: (1 - turn) * 1.2, op: fadeIn(t, 0.2, timed('smooth', 0.1)) * (1 - lo) }, glint: sweep(t, 0.45, 0.3) };
  } },
  // 5 s lower third: primary-colour bar wipes on (snappy), our logo lands (bouncy), PRESENTED BY + sponsor logo, logo sways
  // gently while it holds; everything wipes off by 4.9 s
  presented: { dur: 5, fn: (t, c) => {
    const inP = prog(t, 0, timed('snappy', 0.6)), outP = exitP(t, 5 - 1 / (c.fps || 60), 0.7 - 1 / (c.fps || 60));   // wipe-off ends on the last frame
    const bx = 0.05, by = 0.76, bw = 0.52, bh = 0.15, vis = inP * (1 - outP);
    const bar = (cx) => { if (vis <= 0) return; cx.save(); cx.fillStyle = PRIMARY; cx.globalAlpha = 0.94;
      cx.fillRect(bx * W, by * H, bw * W * vis, bh * H); cx.globalAlpha = 1; cx.fillStyle = ACCENT; cx.fillRect(bx * W, (by + bh) * H - 6, bw * W * vis, 6); cx.restore(); };
    const sp = (cx) => { if (!sponsorImg) return; const o = fadeIn(t, 0.9, timed('smooth', 0.5)) * (1 - exitP(t, 4.4, 0.3)); if (o <= 0.001) return;
      const boxW = 0.2 * W, boxH = 0.1 * H, s = Math.min(boxW / sponsorImg.width, boxH / sponsorImg.height);
      const w = sponsorImg.width * s, h = sponsorImg.height * s; cx.save(); cx.globalAlpha = o;
      cx.drawImage(sponsorImg, (bx + bw - 0.015) * W - w, (by + bh / 2) * H - h / 2, w, h); cx.restore(); };
    const lo = prog(t, 0.35, timed('bouncy', 0.6)) * (1 - exitP(t, 4.35, 0.35)), turn = prog(t, 0.35, timed('smooth', 0.6, 1));
    const sway = prog(t, 0.95, timed('gentle', 0.8)), k = Math.max(0, t - 0.95);    // keeps the hold alive
    return { under: [bar], over: [sp],
      logo: { cx: bx + 0.085, cy: by + bh / 2, bw: 0.13, bh: bh * 0.78, scale: Math.max(lo, 0.001),
              ry: (1 - turn) * 1.2 + sway * 0.30 * Math.sin(k * 2.4), rx: sway * 0.15 * (1 - Math.cos(k * 2.4)), op: lo > 0.01 ? 1 : 0 },
      glint: t < 2.6 ? sweep(t, 1.2, 0.7) : sweep(t, 2.9, 0.7),            // second sweep keeps the hold alive
      texts: [{ str: c.text1 || 'PRESENTED BY', font: 'Body', size: 40, color: TXT, x: bx + 0.19, y: by + bh / 2, align: 'left',
                op: fadeIn(t, 0.7, timed('smooth', 0.4)) * (1 - exitP(t, 4.4, 0.3)), spacing: 3, shadow: false }] };
  } },
  // 4.17 s full-frame lockup, rebuilt by measurement (engine/measure.py) from a reference show-open's closing title
